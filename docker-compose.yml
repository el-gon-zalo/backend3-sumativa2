services:

  mysql:
    image: mysql:8.0
    container_name: translog-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: translog
      MYSQL_USER: translog
      MYSQL_PASSWORD: translog123
      MYSQL_ROOT_PASSWORD: root123

    ports:
      - "3306:3306"

    volumes:
      - translog_mysql_data:/var/lib/mysql

    command: --default-authentication-plugin=mysql_native_password


  backend:
    build:
      context: ./backend3-semana3-main
      dockerfile: Dockerfile

    container_name: translog-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/translog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: translog
      SPRING_DATASOURCE_PASSWORD: translog123

    depends_on:
      - mysql


  bff-web:
    build:
      context: ./bff-web
      dockerfile: Dockerfile

    container_name: bff-web
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      CORE_STREAMING_BASE_URL: http://backend:8080

    depends_on:
      - backend

  bff-mobile:
    build:
      context: ./bff-mobile
      dockerfile: Dockerfile

    container_name: bff-mobile
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:
      CORE_STREAMING_BASE_URL: http://backend:8080

    depends_on:
      - backend


  bff-cajero:
    build:
      context: ./bff-cajero
      dockerfile: Dockerfile

    container_name: bff-cajero
    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:
      CORE_STREAMING_BASE_URL: http://backend:8080

    depends_on:
      - backend    


volumes:
  translog_mysql_data: